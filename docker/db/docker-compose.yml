name: ecommerce-rag-db
services:
  postgres:
    image: ${PG_IMAGE:?set immutable PG_IMAGE in db.env}
    container_name: rag-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_DB: rag
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    command: ["postgres", "-c", "listen_addresses=*", "-c", "shared_buffers=1.5GB", "-c", "effective_cache_size=4GB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=256MB", "-c", "max_connections=50", "-c", "log_min_duration_statement=1000"]
    ports: ["${DB_BIND_IP:?set private DB_BIND_IP in db.env}:5432:5432"]
    volumes:
      - /data/pg:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    secrets: [pg_admin_password, pg_app_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
  redis:
    image: ${REDIS_IMAGE:?set immutable REDIS_IMAGE in db.env}
    container_name: rag-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports: ["${DB_BIND_IP:?set private DB_BIND_IP in db.env}:6379:6379"]
    volumes:
      - /data/redis:/data
      - /etc/ecommerce-rag/redis.conf:/usr/local/etc/redis/redis.conf:ro
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
secrets:
  pg_admin_password:
    file: /etc/ecommerce-rag/pg_admin_password
  pg_app_password:
    file: /etc/ecommerce-rag/pg_app_password
  redis_password:
    file: /etc/ecommerce-rag/redis_password
